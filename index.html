<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Projetos</title>
    <script src="i18n.js" defer></script>
    <script src="projects.js" defer></script>
    <script src="render.js" defer></script>
    <script src="changeImage.js" defer></script>
    <script src="zoomImage.js" defer></script>
    <script src="chessController.js" defer></script>
    <script src="language.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="language.css">

  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/globals.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/animation.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/funny.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/circles.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/primitives.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/effects.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/game.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/loader.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/victorivis/trivolt/index.js" defer></script>
</head>
<body>

    <div class="wrapper">
        <h2>Idioma</h2>

        <div class="lang-toggle">
            <input type="checkbox" id="lang-switch">

            <label for="lang-switch" class="option pt">Português</label>
            <label for="lang-switch" class="option en">English</label>

            <div class="highlight"></div>
        </div>
    </div>

    <main id="portfolio"></main>

    <div id="demos" hidden>
            <div id="trivolt-section">
                <div class="container">
                    <canvas id="game"></canvas>
                    <div class="hidden">
                        <div class="ui-group">
                        <label for="circles" class="control-label">Círculos:</label>
                        <input type="checkbox" id="circles" />
                        </div>
                        <div class="ui-group">
                        <label for="gradients" class="control-label">Gradientes:</label>
                        <input type="checkbox" id="gradients" />
                        </div>
                        <div class="ui-group">
                        <label for="showOrbs" class="control-label">Orbes:</label>
                        <input type="checkbox" id="showOrbs" />
                        </div>
                        <div class="ui-group" id="rounding-group">
                        <label for="rounding" class="control-label hidden">Arredondamento:</label>
                        <input class="hidden" type="range" id="rounding" min="0" max="2000" step="0.5" value="2" />
                        <span class="hidden" id="rounding_value">2</span>
                        </div>
                        <div class="ui-group">
                        <label class="control-label rotation-label">Rotação: </label>
                        <div class="ui-controls">
                            <div class="ui-group">
                            <label for="rotation-x" class="control-label rotation-label">X</label>
                            <input type="checkbox" id="rotation-x" class="ui-checkbox">
                            </div>
                            <div class="ui-group">
                            <label for="rotation-y" class="control-label rotation-label">Y</label>
                            <input type="checkbox" id="rotation-y" class="ui-checkbox">
                            </div class="ui-group">
                            <div class="ui-group">
                            <label for="rotation-z" class="control-label rotation-label">Z</label>
                            <input type="checkbox" id="rotation-z" class="ui-checkbox">
                            </div>
                        </div>
                        <div class="ui-controls">        
                            <div class="ui-group">
                            <label class="control-label rotation-label">V  </label>
                            <input type="checkbox" id="cumulative_speed" class="ui-checkbox">
                            </div>
                        </div>
                        </div> 
                    </div>
                    <div id="infos" class="hidden">
                        <label class="section-title bold">Infos</label>
                        <div class="flex-columns">
                        <div class="ui-column">
                            <label class="section-label">Posições:</label>
                            <div class="ui-group">
                            <label>X</label>
                            <input type="number" id="pos-x" class="ui-param" step="0.1" value="0">
                            <input type="range" id="pos-x-slider" min="-10" max="10" step="0.1" value="0">
                            </div>
                            <div class="ui-group">
                            <label>Y</label>
                            <input type="number" id="pos-y" class="ui-param" step="0.1" value="0">
                            <input type="range" id="pos-y-slider" min="-10" max="10" step="0.1" value="0">
                            </div>
                            <div class="ui-group">
                            <label>Z</label>
                            <input type="number" id="pos-z" class="ui-param" step="0.1" value="6">
                            <input type="range" id="pos-z-slider" min="-10" max="20" step="0.1" value="6">
                            </div>
                        </div>
                        <div class="ui-column">
                            <label class="section-label">Ângulos (graus):</label>
                            <div class="ui-group">
                            <label>X</label>
                            <input type="number" id="angle-x" class="ui-param" value="0" step="1">
                            <input type="range" id="angle-x-slider" min="0" max="360" step="0.1" value="0">
                            </div>
                            <div class="ui-group">
                            <label>Y</label>
                            <input type="number" id="angle-y" class="ui-param" value="0" step="1">
                            <input type="range" id="angle-y-slider" min="0" max="360" step="0.1" value="0">
                            </div>
                            <div class="ui-group">
                            <label>Z</label>
                            <input type="number" id="angle-z" class="ui-param" value="0" step="1">
                            <input type="range" id="angle-z-slider" min="0" max="360" step="0.1" value="0">
                            </div>
                        </div>
                        <div class="ui-column">
                            <label class="section-label">Propriedades:</label>
                            <div class="ui-group">
                            <label>Tipos</label>
                            <input type="checkbox" id="obstacleTypes">
                            </div>
                            <div class="ui-group">
                            <label>Speed (m/fps)</label>
                            <input type="number" id="enemySpeedInput" class="ui-param" step="0.5">
                            <input type="range" id="enemySpeedSlider" min="0" max="60" step="0.5">
                            </div>
                            <div class="ui-group">
                            <label>Spawn Rate (%)</label>
                            <input type="number" id="spawnRateInput" class="ui-param" step="0.2">
                            <input type="range" id="spawnRateSlider" min="0" max="100" step="0.2">
                            </div>
                        </div>
                        </div>
                    </div>
                    <div id="files" class="hidden">
                        <input type="file" id="file-input">
                        <div id="file-info"></div>
                        <pre id="file-content"></pre>
                    </div>
                </div>
            </div>

        <div id="chess">
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        </div>
        <textarea id="output" rows="8"></textarea>
    </div>
</body>
</html>
